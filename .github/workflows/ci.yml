name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=src --cov-report=term-missing --junitxml=test-results.xml
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: sam validate --lint --region ap-northeast-1
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
      - run: sam build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
